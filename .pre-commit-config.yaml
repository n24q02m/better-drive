repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: python scripts/check_gofmt.py
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false

      - id: enforce-commit
        name: enforce feat/fix commit subject
        entry: python scripts/enforce_commit.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
