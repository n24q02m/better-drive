version: 2

release:
  replace_existing_artifacts: true
  # Mark -beta/-rc tags as GitHub pre-releases so they don't take the "Latest" slot.
  prerelease: auto

builds:
  - id: better-drive
    main: .
    binary: better-drive
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/n24q02m/better-drive/internal/version.Version={{.Version}}
      - -X github.com/n24q02m/better-drive/internal/version.Commit={{.Commit}}
      - -X github.com/n24q02m/better-drive/internal/version.Date={{.Date}}
    # Windows tray needs the GUI subsystem (no console window on launch).
    # goreleaser requires both goos AND goarch set on each override entry for
    # it to match anything, so windows/amd64 and windows/arm64 need one each;
    # linux/darwin keep the base ldflags above (no -H windowsgui).
    overrides:
      - goos: windows
        goarch: amd64
        ldflags:
          - -s -w
          - -H windowsgui
          - -X github.com/n24q02m/better-drive/internal/version.Version={{.Version}}
          - -X github.com/n24q02m/better-drive/internal/version.Commit={{.Commit}}
          - -X github.com/n24q02m/better-drive/internal/version.Date={{.Date}}
      - goos: windows
        goarch: arm64
        ldflags:
          - -s -w
          - -H windowsgui
          - -X github.com/n24q02m/better-drive/internal/version.Version={{.Version}}
          - -X github.com/n24q02m/better-drive/internal/version.Commit={{.Commit}}
          - -X github.com/n24q02m/better-drive/internal/version.Date={{.Date}}
      # The darwin tray needs fyne.io/systray's cgo implementation, so these
      # two overrides turn cgo on for darwin only; every other goos/goarch
      # combination stays on the CGO_ENABLED=0 base build above. The
      # goreleaser host (macos-latest) is arm64, so darwin/amd64 needs an
      # explicit cross-compiler; Go accepts a CC value carrying arguments.
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
        ldflags:
          - -s -w
          - -X github.com/n24q02m/better-drive/internal/version.Version={{.Version}}
          - -X github.com/n24q02m/better-drive/internal/version.Commit={{.Commit}}
          - -X github.com/n24q02m/better-drive/internal/version.Date={{.Date}}
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch x86_64
        ldflags:
          - -s -w
          - -X github.com/n24q02m/better-drive/internal/version.Version={{.Version}}
          - -X github.com/n24q02m/better-drive/internal/version.Commit={{.Commit}}
          - -X github.com/n24q02m/better-drive/internal/version.Date={{.Date}}

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "better-drive_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - repository:
      owner: n24q02m
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/n24q02m/better-drive"
    description: "2-way Google Drive sync with .driveignore filter (rclone engine, Windows tray)"
    license: "MIT"
    binaries:
      - better-drive
    dependencies:
      - formula: rclone
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump better-drive to {{ .Tag }}"
    # homebrew-tap is the stable channel: anyone running
    # `brew install n24q02m/homebrew-tap/better-drive` expects the latest
    # stable release, not a beta they never asked for. release.prerelease:
    # auto above already keeps prerelease tags out of GitHub's "Latest" slot;
    # skip_upload: auto applies that same policy one layer down, by skipping
    # this cask bump whenever the current tag is a prerelease.
    skip_upload: "auto"

scoops:
  - repository:
      owner: n24q02m
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/n24q02m/better-drive"
    description: "2-way Google Drive sync with .driveignore filter (rclone engine, Windows tray)"
    license: MIT
    depends:
      - rclone
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    commit_msg_template: "feat: bump better-drive to {{ .Tag }}"
    # Same reasoning as the skip_upload above the brews entry: scoop-bucket is
    # the stable channel for `scoop install better-drive`, so a prerelease
    # build must never overwrite the manifest there. skip_upload: auto keeps
    # this layer in step with release.prerelease: auto, so betas stay out of
    # both the GitHub "Latest" slot and the scoop bucket.
    skip_upload: "auto"

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
