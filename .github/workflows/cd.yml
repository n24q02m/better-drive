name: CD

# CD is dispatch-only and fail-closed. Tag pushes are read-only observers;
# publication remains disabled until exact signed BSR G1/G2 loader tuple and
# protected environments are available.
#
# Prepared candidate artifacts and provenance are built credential-free via
# .goreleaser.prepare.yaml and archived as run artifacts.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (stable or beta candidate)"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: cd-better-drive
  cancel-in-progress: false

jobs:
  # ==================== Prepare Candidate (workflow_dispatch) ====================
  prepare-candidate:
    name: Prepare Candidate Artifacts
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify release preparation, release policy, and installers
        run: |
          python scripts/verify_prepare_config.py .
          python scripts/verify_release_policy.py .
          python scripts/verify_installers.py .

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Build candidate binaries credential-free
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --config=.goreleaser.prepare.yaml --skip=publish --clean

      - name: Record candidate provenance manifest
        shell: bash
        run: |
          mkdir -p dist/provenance
          {
            echo "Candidate release manifest"
            echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Ref: ${{ github.ref }}"
            echo "Commit: ${{ github.sha }}"
            echo "Release type: ${{ github.event.inputs.release_type }}"
            echo "Status: PREPARED_CREDENTIAL_FREE_CANDIDATE"
            echo ""
            echo "Checksums:"
            if [ -f dist/checksums.txt ]; then
              cat dist/checksums.txt
            else
              echo "No checksums.txt generated"
            fi
          } > dist/provenance/manifest.txt

      - name: Upload prepared candidate artifacts and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-release-artifacts
          path: dist/
          if-no-files-found: error

      - name: Fail closed on unverified live publication
        shell: bash
        run: |
          echo "==> Candidate release preparation successful."
          echo "==> Live publication remains disabled pending exact signed BSR G1/G2 loader availability."
