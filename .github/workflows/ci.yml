name: CI

on:
  branch_protection_rule:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go build ./...
      - name: Verify release preparation, release policy, and installers
        run: python scripts/verify_prepare_config.py . && python scripts/verify_release_policy.py . && python scripts/verify_installers.py .
      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Enforce coverage floor
        # Coverage is a single-platform gate: the profile is written by the
        # step above, and on the windows runner it is not reliably present
        # (`go tool cover` reports coverage.out missing even when the tests
        # pass). Behaviour is still tested on both OSes; only the percentage
        # is enforced once, on linux.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 65) ? 0 : 1 }' || {
            echo "coverage ${pct}% is below the 65% floor"; exit 1; }

  codeql:
    # CodeQL requires the repo to be public (or have GitHub Advanced Security).
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  installer-smoke:
    name: Installer smoke test (${{ matrix.os }})
    # Gate behind workflow_dispatch: these install from the live
    # scoop-bucket/homebrew-tap repos and pull real release assets, so PR
    # pushes should not depend on external reachability or a release existing
    # yet. A tag push can't be used instead: goreleaser hasn't updated those
    # taps by the time the tag-triggered workflow run starts, so it would
    # race the release and fail. Run on demand after a release publishes.
    # This directly tests the scoop + brew distribution channels.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install via scoop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            try {
              iwr -useb get.scoop.sh | iex
            } catch {
              Write-Error "scoop bootstrap failed: $_"
              exit 1
            }
          }
          scoop bucket add n24q02m https://github.com/n24q02m/scoop-bucket
          scoop install better-drive
          better-drive --version
      - name: Install via brew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install n24q02m/homebrew-tap/better-drive
          better-drive --version

  scorecard:
    name: Scorecard analysis
    if: (github.event_name == 'branch_protection_rule' || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

  bot-governance:
    name: Bot PR rate limit and duplicate check
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          bot_branch_regex='^(bolt[-/]|palette[-/]|palette-ux-|fix/web-scraper-|jules[-/]|sentinel[-/]|renovate[-/])|-[0-9]{14,}$'
          if ! printf '%s\n' "$BRANCH" | grep -qE "$bot_branch_regex"; then
            echo "Not a governed bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Governed bot PR detected on branch: $BRANCH"
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
            date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          if ! count=$(SINCE="$since" BOT_BRANCH_REGEX="$bot_branch_regex" gh pr list \
            --repo "$REPO" --state open --limit 1000 \
            --json createdAt,headRefName,author \
            --jq '[.[]
              | select(.author.login == env.ACTOR)
              | select(.createdAt > env.SINCE)
              | select(.headRefName | test(env.BOT_BRANCH_REGEX))] | length'); then
            echo "Unable to query open PRs for bot rate limiting." >&2
            exit 1
          fi
          echo "Governed bot PRs by $ACTOR in the last 24 hours: $count"
          if [ "${count:-0}" -gt 5 ]; then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "Bot rate limit exceeded: $count governed PRs were created in the last 24 hours (limit: 5/day). Consolidate related fixes before reopening this change."
            echo "PR #$PR_NUMBER closed for exceeding the bot rate limit."
            exit 0
          fi

          keyword=$(printf '%s' "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
            tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$keyword" ]; then
            echo "No searchable title keyword, skipping duplicate check."
            exit 0
          fi

          if ! dupes=$(gh pr list --repo "$REPO" --state open --limit 1000 \
            --search "$keyword" --json number \
            --jq '[.[] | select(.number != (env.PR_NUMBER | tonumber))] | length'); then
            echo "Unable to query open PRs for duplicate detection." >&2
            exit 1
          fi
          echo "Similar open PRs for '$keyword': $dupes"
          if [ "${dupes:-0}" -ge 1 ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "Possible duplicate: found $dupes open PR(s) with similar title ('$keyword'). Review related changes before merging."
          fi
